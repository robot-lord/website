name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on high/critical advisories except those allowed below, each with a reason.
      # GHSA-fc5q-39xc-vjpf: picomatch ReDoS; every version affected, no fix yet.
      #   Build-time only (Astro's glob matching on fixed patterns); never reaches
      #   the static site. User decision 2026-11-17. Remove once picomatch ships a fix.
      - name: npm audit
        run: |
          allow='GHSA-fc5q-39xc-vjpf'
          npm audit --json > audit.json || true
          bad=$(jq -r --arg allow "$allow" '
            [.vulnerabilities[] | select(.severity=="high" or .severity=="critical")
             | .via[] | objects | select(.severity=="high" or .severity=="critical")
             | .url | split("/") | last
             | select(. as $id | ($allow | split(" ") | index($id)) | not)]
            | unique | join(" ")' audit.json)
          if [ -n "$bad" ]; then echo "high/critical advisories: $bad"; npm audit --audit-level=high; exit 1; fi
          echo "npm audit: nothing high/critical beyond: $allow"
      - run: npm run build
